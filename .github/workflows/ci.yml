name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Check all binaries
        run: cargo check --bins

      - name: Test suite (serial, as `task test` does)
        run: cargo test -- --test-threads=1 -q

      - name: Determinism + sim perf smoke (release)
        run: |
          cargo build --release --example sim_perf
          cargo run --release --example sim_perf | tee perf-smoke.txt

      - name: Balance harness smoke
        run: cargo run --release --example sim_balance -- --games 3

      - name: Upload perf smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke
          path: perf-smoke.txt
          if-no-files-found: ignore

  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: castle-lanes-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: castle-lanes-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --bins
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          for bin in castle_lanes_server castle_lanes_client castle_lanes_bot; do
            cp target/release/$bin dist/
          done
          cp README.md dist/
          cp config/balance.json dist/
          cp -r assets dist/
          tar czf castle-lanes-${{ matrix.artifact }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: castle-lanes-*.tar.gz
